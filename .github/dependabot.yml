version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # nodejs-mobile (Android host) cannot run the Express 5 dependency chain.
      - dependency-name: express
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
