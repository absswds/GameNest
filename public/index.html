<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2">
<title>GameNest</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/style.css">
<!-- 字体已内嵌到 assets/fonts(离线可用),不再依赖 Google Fonts -->
</head>
<body class="lobby-page">
  <header class="lb-top" id="lobbyHeader">
    <div class="lb-top-bg" aria-hidden="true"></div>
    <div class="lb-top-in">
      <div class="lb-logo">GameNest</div>
      <div class="lb-bar" id="headerBar">
        <div class="lb-search-wrap" id="searchWrap">
          <svg class="lb-search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input class="lb-search-input" id="gameSearch" type="search" placeholder="搜索游戏名、标签、类型" autocomplete="off" spellcheck="false">
          <button type="button" class="lb-icon-btn lb-search-close" id="searchClose" aria-label="关闭搜索">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="lb-top-actions">
          <button type="button" class="lb-icon-btn lb-search-open" id="searchOpen" aria-label="搜索游戏" aria-expanded="false" aria-controls="searchWrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          </button>
          <button type="button" class="lb-icon-btn lb-theme-btn" id="themeBtn" aria-label="切换到深色模式">
            <svg class="lb-ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <svg class="lb-ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
          </button>
          <button type="button" class="lb-icon-btn lang-switch" id="langSwitchBtn" aria-label="切换语言" onclick="var l=window.__ACTIVE_LANG==='zh'?'en':'zh';window._switchLang(l)">中/EN</button>
        </div>
      </div>
    </div>
  </header>

  <main class="lobby-shell">
    <section class="lb-resume-wrap" id="resumeSection" style="display:none">
      <div class="lb-resume">
        <div class="lb-resume-thumb">
          <img id="resumeCover" class="lb-resume-cover" src="" alt="" style="display:none">
          <div id="resumeFallback" class="lb-resume-fallback"></div>
        </div>
        <div class="lb-resume-body">
          <div class="lb-resume-title" id="resumeRoomName">房间</div>
          <div class="lb-resume-meta" id="resumeRoomSub">你已在这间房中，点击返回</div>
        </div>
        <button type="button" class="lb-resume-btn" id="resumeBtn">返回房间</button>
      </div>
    </section>

    <div class="mobile-only-banner" id="mobileOnlyBanner" style="display:none">
      <strong id="mobileOnlyTitle">离线单机模式</strong>
      <span id="mobileOnlySub">流量下无法与他人联机，但可加 AI 玩。</span>
    </div>
    <p class="wifi-note" id="wifiNote" style="display:none">确保所有设备连接到同一个 Wi-Fi 或手机热点。</p>

    <section class="lb-hero-section" id="heroSection" aria-label="本周新游戏">
      <div class="lb-hero-track" id="heroTrack"></div>
      <div class="lb-hero-dots" id="heroDots"></div>
    </section>

    <section class="lb-join-section" id="joinPanel">
      <div class="lb-join-row">
        <input class="lb-input" id="roomCodeInput" type="text" maxlength="4" placeholder="输入房间号" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
        <button type="button" class="lb-join-btn" id="joinBtn">加入</button>
      </div>
      <div class="lan-rooms-panel" id="lanRoomsPanel" style="display:none">
        <div class="lan-rooms-header">
          <span class="lan-rooms-title" id="lanRoomsTitle">局域网房间</span>
          <button type="button" class="lan-refresh-btn" id="refreshRoomsBtn">↻ 刷新</button>
        </div>
        <div class="lan-rooms-list" id="lanRoomsList">
          <div class="lan-rooms-empty" id="lanRoomsEmpty">暂无可加入的房间</div>
        </div>
      </div>
    </section>

    <div class="last-game-row" id="lastGameRow" style="display:none">
      <button type="button" class="lb-last-chip" id="lastGameChip"></button>
    </div>

    <section class="lb-filters" aria-label="游戏筛选">
      <div class="lb-chips lb-cat-chips" id="categoryChips" role="tablist"></div>
    </section>

    <section class="lb-browse" aria-labelledby="allGamesHeading">
      <div class="lb-sec">
        <h2 id="allGamesHeading">全部游戏</h2>
        <span class="lb-sec-count num" id="gameCount"></span>
        <div class="lb-count-wrap">
          <div class="lb-count-seg" id="countChips" role="group" aria-label="人数"></div>
          <span class="lb-count-unit" id="countUnit">人</span>
        </div>
      </div>
      <div class="lb-grid" id="gameGrid" data-boot="1"></div>
      <p class="lb-empty" id="emptyState" style="display:none">没有找到匹配的游戏，换个关键词试试。</p>
    </section>

    <footer class="lobby-footer">
      <a class="lobby-footer-link" href="https://github.com/absswds/GameNest" target="_blank" rel="noopener noreferrer" aria-label="GitHub: absswds/GameNest">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>absswds / GameNest</span>
      </a>
    </footer>
  </main>

  <div class="toast" id="toast"></div>
  <button type="button" id="quickCreate" class="quick-create-btn">创建房间</button>

<script src="/js/session-store.js"></script>
<script src="/js/haptics.js"></script>
<script src="/js/lang/zh.js"></script>
<script src="/js/lang/en.js"></script>
<script src="/js/lang/catalog-zh.js"></script>
<script src="/js/lang/catalog-en.js"></script>
<script src="/js/game-catalog.js"></script>
<script>
const NEW_GAMES = ['liarsdice', 'blackjack'];

let selectedGame = 'monopoly';
let activeCategory = (typeof _t === 'function' ? _t('all_categories') : '\u5168\u90e8');
let searchText = '';
let activeCount = 0; // 0 = any; 6 means 6 or more

const reduceMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
const desktopMQ = window.matchMedia ? window.matchMedia('(min-width: 800px)') : { matches: true };

// ?wifi= comes from the Android app; remember it so it survives leaving and returning to the lobby
const __isMobileData = (function () {
  var w = new URLSearchParams(location.search).get('wifi');
  try {
    if (w === '0' || w === '1') sessionStorage.setItem('wifi', w);
    else w = sessionStorage.getItem('wifi');
  } catch (e) {}
  return w === '0';
})();
const __allGames = window.gameCatalog.list();
const __allFeatured = window.gameCatalog.featured();
// Offline: show games with bots or a solo mode; werewolf bots can't really talk, so it's hidden.
const __SOLO_GAMES = new Set(window.SOLO_GAMES || []);
const __OFFLINE_HIDDEN = new Set(['werewolf']);
function playable(g) {
  if (!__isMobileData) return true;
  if (__OFFLINE_HIDDEN.has(g.id)) return false;
  return g.supportsAI !== false || __SOLO_GAMES.has(g.id);
}
const catalog = __allGames.filter(playable);
const featuredGames = __allFeatured.filter(playable);

function escapeHtml(text) {
  return String(text || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function getGameInfo(id) {
  return window.gameCatalog.byId(id) || {
    id: id,
    name: id,
    icon: '?',
    subtitle: '',
    description: '',
    players: '',
    duration: '',
    category: '',
    tags: [],
    cover: ''
  };
}

function getSocketURL() {
  const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
  return protocol + location.host;
}

function buildCoverMedia(game, opts) {
  const cls = opts && opts.hero ? 'lb-hero-img' : 'lb-card-img';
  const fbCls = opts && opts.hero ? 'lb-hero-fallback' : 'lb-card-fallback';
  const loadingAttr = opts && opts.eager ? '' : ' loading="lazy"';
  if (game.cover) {
    return '<img class="' + cls + '" src="' + escapeHtml(game.cover) + '" alt="' + escapeHtml(game.name) + '"' + loadingAttr + ' decoding="async">' +
      '<div class="' + fbCls + '" style="display:none">' + escapeHtml(game.icon) + '</div>';
  }
  return '<div class="' + fbCls + '">' + escapeHtml(game.icon) + '</div>';
}

function wireCoverImages(container) {
  if (!container) return;
  container.querySelectorAll('img.lb-card-img, img.lb-hero-img').forEach(function(img) {
    var markLoaded = function() { img.classList.add('is-loaded'); };
    var markError = function() {
      img.style.display = 'none';
      var fb = img.nextElementSibling;
      if (fb) fb.style.display = 'flex';
    };
    if (img.complete) {
      if (img.naturalWidth > 0) markLoaded();
      else markError();
    } else {
      img.addEventListener('load', function() {
        if (typeof img.decode === 'function') {
          img.decode().then(markLoaded, markLoaded);
        } else {
          markLoaded();
        }
      }, { once: true });
      img.addEventListener('error', markError, { once: true });
    }
  });
}

function getHeroGames() {
  var list = NEW_GAMES.map(function(id) {
    return window.gameCatalog.byId(id);
  }).filter(function(g) {
    return g && playable(g);
  });
  if (!list.length) {
    if (featuredGames.length) list = [featuredGames[0]];
    else if (catalog.length) list = [catalog[0]];
  }
  return list;
}

function renderHero() {
  var section = document.getElementById('heroSection');
  var track = document.getElementById('heroTrack');
  var dots = document.getElementById('heroDots');
  if (!section || !track) return;
  var games = getHeroGames();
  if (!games.length) {
    section.style.display = 'none';
    return;
  }
  section.style.display = '';
  var tagText = typeof _t === 'function' ? _t('lobby_new_this_week') : '本周新游戏';
  track.classList.toggle('is-carousel', games.length > 1);
  track.innerHTML = games.map(function(game) {
    var isSelected = game.id === selectedGame;
    var metaParts = [game.players, game.subtitle].filter(Boolean).join(' · ');
    return '<button type="button" class="lb-hero-card' + (isSelected ? ' selected' : '') + '" data-game="' + escapeHtml(game.id) + '" aria-pressed="' + (isSelected ? 'true' : 'false') + '">' +
      '<div class="lb-hero-media">' + buildCoverMedia(game, { hero: true, eager: true }) + '</div>' +
      '<div class="lb-hero-cap">' +
        '<span class="lb-hero-tag">' + escapeHtml(tagText) + '</span>' +
        '<b class="lb-hero-name">' + escapeHtml(game.name) + '</b>' +
        '<small class="lb-hero-meta num">' + escapeHtml(metaParts) + '</small>' +
      '</div>' +
      '<span class="lb-check" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-6.5"/></svg></span>' +
    '</button>';
  }).join('');
  wireCoverImages(track);
  track.querySelectorAll('.lb-hero-card').forEach(function(card) {
    card.addEventListener('click', function() {
      selectOrCreate(this.dataset.game);
    });
  });

  if (dots) {
    var syncHeroDots = function() {
      var needsDots = dots.children.length > 1 && track.scrollWidth > track.clientWidth + 1;
      dots.style.display = needsDots ? '' : 'none';
    };
    if (games.length > 1) {
      var slideTpl = typeof _t === 'function' ? _t('hero_slide_n') : '查看第 %s 个新游戏';
      dots.innerHTML = games.map(function(g, i) {
        return '<button type="button" class="lb-hero-dot' + (i === 0 ? ' active' : '') + '" data-index="' + i + '" aria-label="' + escapeHtml(slideTpl.replace('%s', i + 1)) + '"></button>';
      }).join('');
      syncHeroDots();
      dots.querySelectorAll('.lb-hero-dot').forEach(function(dot) {
        dot.addEventListener('click', function() {
          var idx = +this.dataset.index;
          var slides = track.querySelectorAll('.lb-hero-card');
          if (slides[idx]) {
            track.scrollTo({
              left: slides[idx].offsetLeft,
              behavior: reduceMotion.matches ? 'auto' : 'smooth'
            });
          }
        });
      });
      if (!track._dotsBound) {
        track._dotsBound = true;
        var scrollTick = false;
        track.addEventListener('scroll', function() {
          if (scrollTick) return;
          scrollTick = true;
          requestAnimationFrame(function() {
            scrollTick = false;
            var slides = track.querySelectorAll('.lb-hero-card');
            var dotEls = dots.querySelectorAll('.lb-hero-dot');
            if (!slides.length || !dotEls.length) return;
            var best = 0;
            var bestDist = Infinity;
            for (var i = 0; i < slides.length; i++) {
              var d = Math.abs(slides[i].offsetLeft - track.scrollLeft);
              if (d < bestDist) { bestDist = d; best = i; }
            }
            dotEls.forEach(function(el, i) {
              el.classList.toggle('active', i === best);
            });
          });
        }, { passive: true });
        if (!track._dotsObserved) {
          track._dotsObserved = true;
          var onResize = function() { syncHeroDots(); };
          if (typeof ResizeObserver === 'function') new ResizeObserver(onResize).observe(track);
          else window.addEventListener('resize', onResize);
        }
      }
    } else {
      dots.style.display = 'none';
      dots.innerHTML = '';
    }
  }
}

function buildBrowseCard(game, idx) {
  const isSelected = game.id === selectedGame;
  const selectedClass = isSelected ? ' selected' : '';
  const metaParts = [game.players, game.duration].filter(Boolean).join(' · ');
  return '<button type="button" class="lb-card browse-card' + selectedClass + '" data-game="' + escapeHtml(game.id) + '" aria-pressed="' + (isSelected ? 'true' : 'false') + '">' +
    '<div class="lb-card-media">' + buildCoverMedia(game, { hero: false, eager: idx < 6 }) + '</div>' +
    '<div class="lb-card-scrim">' +
      '<h3 class="lb-card-name">' + escapeHtml(game.name) + '</h3>' +
      '<div class="lb-card-meta num">' + escapeHtml(metaParts) + '</div>' +
    '</div>' +
    '<span class="lb-check" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-6.5"/></svg></span>' +
  '</button>';
}

// The floating button names the game it will open, so a tap is never a surprise
function updateQuickCreate() {
  const label = typeof _t === 'function' ? _t('create_room') : '创建房间';
  const game = getGameInfo(selectedGame);
  document.getElementById('quickCreate').innerHTML = '<span class="qc-label">' + escapeHtml(label) + '</span>' +
    (game && game.name ? '<span class="qc-game">' + escapeHtml(game.name) + '</span>' : '');
}

// Pinyin for game names, so typing "ddz" or "doudizhu" finds 斗地主
const NAME_PINYIN = {
  '井字棋': 'jing zi qi', '五子棋': 'wu zi qi', '达芬奇密码': 'da fen qi mi ma', '斗地主': 'dou di zhu',
  '爆炸猫': 'bao zha mao', '魔力桥': 'mo li qiao', '数独': 'shu du', '24点': 'er shi si dian',
  '扫雷竞速': 'sao lei jing su', '数字炸弹': 'shu zi zha dan', '抽鬼牌': 'chou gui pai', '骗子酒馆': 'pian zi jiu guan',
  '大老二': 'da lao er', '麻将': 'ma jiang', '德州扑克': 'de zhou pu ke', '飞行棋': 'fei xing qi',
  '贪吃蛇大乱斗': 'tan chi she da luan dou', '中国象棋': 'zhong guo xiang qi', '国际象棋': 'guo ji xiang qi',
  '西洋跳棋': 'xi yang tiao qi', '四子棋': 'si zi qi', '黑白棋': 'hei bai qi', '围棋 9路': 'wei qi jiu lu',
  '大富翁': 'da fu weng', '合成大西瓜': 'he cheng da xi gua', '羊了个羊': 'yang le ge yang', '你画我猜': 'ni hua wo cai',
  '战舰': 'zhan jian', '红心大战': 'hong xin da zhan', '真心话大冒险': 'zhen xin hua da mao xian'
};
function pinyinKeys(name) {
  const py = NAME_PINYIN[name];
  if (!py) return '';
  const syl = py.split(' ');
  return syl.join('') + ' ' + syl.map(function(x) { return x[0]; }).join('');
}

function matches(game) {
  const haystack = [
    game.id,
    pinyinKeys(game.name),
    game.name,
    game.subtitle,
    game.description,
    game.category,
    (game.tags || []).join(' ')
  ].join(' ').toLowerCase();
  const allLabel = (typeof _t === 'function' ? _t('all_categories') : '\u5168\u90e8');
  if (activeCategory !== allLabel && game.category !== activeCategory) return false;
  if (activeCount) {
    const nums = (game.players || '').match(/\d+/g) || [];
    const lo = nums.length ? +nums[0] : 1, hi = nums.length ? +nums[nums.length - 1] : 99;
    const solo = activeCount === 1 && (window.SOLO_GAMES || []).indexOf(game.id) >= 0;
    if (!solo && (activeCount >= 6 ? hi < 6 : (activeCount < lo || activeCount > hi))) return false;
  }
  if (!searchText) return true;
  return haystack.indexOf(searchText) >= 0 || haystack.indexOf(searchText.replace(/\s+/g, '')) >= 0;
}

function updateSelectionUI() {
  document.querySelectorAll('.lb-card, .lb-hero-card').forEach(function(el) {
    var on = el.dataset.game === selectedGame;
    el.classList.toggle('selected', on);
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}

function selectOrCreate(gameId) {
  var wasSelected = selectedGame === gameId;
  selectedGame = gameId;
  updateSelectionUI();
  updateQuickCreate();
  if (wasSelected) createRoom();
}

// C1: elastic indicator underline sliding between category tabs
var catIndControl = (function() {
  var list = document.getElementById('categoryChips');
  if (!list) return { place: function() {}, moveTo: function() {} };

  function readPos() {
    return {
      x: parseFloat(list.style.getPropertyValue('--x')) || 0,
      w: parseFloat(list.style.getPropertyValue('--w')) || 0
    };
  }

  function place(btn) {
    if (!btn) return;
    list.style.setProperty('--x', btn.offsetLeft + 'px');
    list.style.setProperty('--w', btn.offsetWidth + 'px');
  }

  function current() {
    return list.querySelector('.lb-cat-chip.selected') || list.querySelector('.lb-cat-chip');
  }

  function stretchMove(ind, from, to) {
    if (!ind || reduceMotion.matches) return;
    if (from.w <= 0 || (from.x === to.x && from.w === to.w)) return;
    var right = to.x > from.x, lead = 0.9, trail = 0.15;
    var L = from.x + (to.x - from.x) * (right ? trail : lead);
    var R = from.x + from.w + (to.x + to.w - from.x - from.w) * (right ? lead : trail);
    ind.animate([
      { transform: 'translateX(' + from.x + 'px)', width: from.w + 'px' },
      { transform: 'translateX(' + L + 'px)', width: Math.max(0, R - L) + 'px', offset: 0.4 },
      { transform: 'translateX(' + to.x + 'px)', width: to.w + 'px' }
    ], { duration: 360, easing: 'cubic-bezier(0.33, 1, 0.68, 1)' });
  }

  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(function() {
      place(current());
    }).observe(list);
  } else {
    window.addEventListener('resize', function() { place(current()); });
  }

  return {
    placeCurrent: function() {
      place(current());
    },
    moveTo: function(btn, animate) {
      var ind = list.querySelector('.lb-chip-ind');
      var from = readPos();
      place(btn);
      if (animate) stretchMove(ind, from, readPos());
    }
  };
})();

function buildCategoryChips() {
  const chips = [(typeof _t === 'function' ? _t('all_categories') : '\u5168\u90e8')].concat(window.gameCatalog.categories());
  const root = document.getElementById('categoryChips');
  if (!root) return;
  root.innerHTML = '<span class="lb-chip-ind" aria-hidden="true"></span>' + chips.map(function(category) {
    const isSel = category === activeCategory;
    return '<button type="button" role="tab" aria-selected="' + (isSel ? 'true' : 'false') + '" class="lb-chip lb-cat-chip' + (isSel ? ' selected' : '') + '" data-category="' + escapeHtml(category) + '">' + escapeHtml(category) + '</button>';
  }).join('');
  root.querySelectorAll('.lb-cat-chip').forEach(function(chip) {
    chip.addEventListener('click', function() {
      var nextCat = this.dataset.category;
      if (nextCat === activeCategory) return;
      activeCategory = nextCat;
      root.querySelectorAll('.lb-cat-chip').forEach(function(c) {
        var on = c.dataset.category === activeCategory;
        c.classList.toggle('selected', on);
        c.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      catIndControl.moveTo(this, true);
      renderCatalog({ animate: true });
    });
  });
  requestAnimationFrame(catIndControl.placeCurrent);
}

function syncCategorySelection(animate) {
  var root = document.getElementById('categoryChips');
  if (!root) return;
  var targetBtn = null;
  root.querySelectorAll('.lb-cat-chip').forEach(function(c) {
    var on = c.dataset.category === activeCategory;
    c.classList.toggle('selected', on);
